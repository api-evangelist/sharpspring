aid: sharpspring
name: SharpSpring
description: SharpSpring — now sold as Constant Contact Lead Gen & CRM after Constant Contact acquired
  the company in 2021 — is a marketing automation and CRM platform for small businesses and digital
  marketing agencies, covering email marketing, landing pages, forms, visual automation workflows,
  social management, campaign tracking, lead scoring and a built-in sales CRM. Its developer surface is
  the SharpSpring Open API, a JSON-RPC-style HTTPS POST endpoint at api.sharpspring.com/pubapi/ that
  exposes roughly 120 published methods over leads, accounts, opportunities, campaigns, deal stages,
  emails, email jobs, lists and list members, fields, folders, notes, products and tasks. Authentication
  is a static account ID plus secret key generated in the application; there is no OAuth, no scopes and
  no OpenAPI description. Event delivery is handled by workflow and form Postback URLs rather than a
  webhook subscription API.
