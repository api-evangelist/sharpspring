note: >-
  SharpSpring publishes hard numeric limits in the Open API overview, which is more than most
  providers do — but it publishes no runtime signal. There is no documented X-RateLimit-*, RateLimit-*
  or Retry-After header, and exhaustion is not reported as HTTP 429: it comes back as an application
  error code (106 daily, 107 per-second, 209 per-request query count) inside a 200-level JSON envelope.
  An agent therefore cannot discover its remaining budget from a response; it can only detect
  exhaustion after the fact by parsing the error object. Limits could not be verified live because the
  endpoint requires an account credential.
