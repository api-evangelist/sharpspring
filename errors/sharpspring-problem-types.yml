format: proprietary
note: >-
  Not RFC 9457. SharpSpring returns HTTP 200 for most application outcomes and carries the failure in
  a JSON-RPC-style envelope: every response has result, error and id. API-level failures (auth,
  malformed request, quota) populate the top-level `error` object with a numeric code, a message and a
  `data` object naming the offending param. Object-level failures — invalid objects inside a bulk
  create/update — leave `error` null and return per-object error entries inside the `result` array, so
  a caller that only checks HTTP status or the top-level error will silently miss partial failures.
  The numeric codes below are published verbatim by the provider; the class groupings and the
  remediation column are API Evangelist's reading of them, not provider text.
envelope:
  transport: HTTP 200 for most outcomes; 401 observed on missing/invalid credentials
  fields:
    result: return value — objects and object-level errors
    error: API-level error object (code, message, data)
    id: the caller-supplied request id, echoed back
  api_level_error_shape:
    code: integer
    message: string
    data: object naming the offending parameter(s)
  object_level_errors: returned inside the result array, per submitted object
classes:
- range: 1xx
  meaning: request framing, authentication and quota
- range: 2xx
  meaning: method signature, parameters and object validation
- range: 3xx
  meaning: persistence, uniqueness and reseller/sub-account permissions
- range: 404
  meaning: record not found
- range: 999
  meaning: unclassified server error
