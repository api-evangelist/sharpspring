official_package_count: 0
note: >-
  SharpSpring publishes NO first-party client library in any language. The provider's own Example Code
  article teaches raw PHP cURL against the single POST endpoint and links no SDK. The github.com/
  sharpspring organization is real and GitHub-verified (69 public repos, blog https://sharpspring.com,
  Gainesville FL) but contains only forks of unrelated third-party projects — guzzle3, predis,
  twilio-php, prometheus exporters, modsecurity-docker, hadolint — and not one repository that wraps
  the SharpSpring API. Every library below is community-authored, and every one of them is stale: the
  most-used PHP client last released in 2017, and the newest entry is an n8n community node rather
  than an SDK. That is the finding — an API with ~120 methods and no maintained client anywhere. No
  `SDKs` pointer is emitted in apis.yml, because there is no official SDK to point at.
